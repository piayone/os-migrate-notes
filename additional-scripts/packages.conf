# packages.conf - what initual-setup.sh installs. Edit it with additional-scripts/sync-notes.sh
# (menu option 4: list, search, add, remove) or by hand. pkg-track.fish also adds and removes
# entries by itself when you install or remove packages.
#
# [native]  packages from the distro's own repos: pacman (+ AUR through paru), apt, dnf, zypper.
#           name [apt=x] [dnf=x] [zypper=x] [pacman=x] [only=apt,dnf] [arch]
#             name        used on every distro that has a package with this name
#             apt=x ...   the name to use on that package manager instead
#             only=a,b    install only with those package managers
#             arch        short for only=pacman (Arch/CachyOS only)
#             de=a,b      only when one of those desktop environments was chosen in
#                         initual-setup.sh (entries without de= are always installed)
#             replaces=x  uninstall package x first (for a package that conflicts with this one)
#           Names a distro does not have are skipped and listed at the end of the setup.
# [flatpak] flatpak apps by application id, the same on every distro.
# [snap]    snap packages by name.
# [pipx]    Python apps installed with pipx: a PyPI name (spotdl), or the address for something that
#           is not on PyPI (git+https://github.com/user/repo, a path, a web address). 
#           (sync-notes.sh pkg rename). Uninstall and remove accept the name or the address.
# [git]     git repos, one address per line, cloned to ~/Documents/<repo name>.
